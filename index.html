<!DOCTYPE html>
<html>
<head>
    <title>TIN Registration</title>
</head>
<body>

    <h2>TIN Registration Details</h2>

    <form>
        <label>Applicant Name:</label><br>
        <input type="text" placeholder="Enter your name"><br><br>

        <label>Designation:</label><br>
        <input type="text" placeholder="Housewife"><br><br>

        <label>Civil Status:</label><br>
        <select>
            <option>Single</option>
            <option>Married</option>
        </select><br><br>

        <label>Acknowledgement No:</label><br>
        <input type="text" placeholder="Enter acknowledgement number"><br><br>

        <button type="submit">Submit</button>
    </form>

</body>
</html>
